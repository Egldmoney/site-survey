<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E6E1;--panel:#F8F8F5;--raise:#FFFFFF;--ink:#1A1D20;--muted:#5C6268;--line:#C8CCC6;
  --yellow:#FFD21F;--onyellow:#1A1D20;--red:#D7261E;--stage:#2B2F33;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 10px 26px rgba(30,35,40,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1F22;--panel:#25292D;--raise:#2E3337;--ink:#ECEDE9;--muted:#A0A7AD;--line:#3A4045;--stage:#141618;
    --shadow:0 10px 26px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1F22;--panel:#25292D;--raise:#2E3337;--ink:#ECEDE9;--muted:#A0A7AD;--line:#3A4045;--stage:#141618;
  --shadow:0 10px 26px rgba(0,0,0,.5);color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* Home */
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:960px;margin:0 auto}
.mark{width:36px;height:36px;flex:none;border-radius:8px;background:var(--yellow);display:grid;place-items:center;color:#1A1D20}
#projName{flex:1;min-width:0;font:600 26px/1.1 "Barlow Condensed",Barlow,sans-serif;border:0;background:transparent;padding:6px 2px;border-bottom:2px solid transparent;border-radius:0}
#projName::placeholder{color:var(--muted)}
#projName:focus{outline:none;border-bottom-color:var(--yellow)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.icon-btn:hover{background:var(--raise)}
.sub{max-width:960px;margin:0 auto;padding:0 18px 8px;color:var(--muted);font-size:15px}
#pages{max-width:960px;margin:0 auto;padding:10px 16px 130px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 26px}
.page{display:flex;flex-direction:column;gap:12px}
.sheet{position:relative;aspect-ratio:1654/2339;background:#fff;color:#111;box-shadow:var(--shadow);container-type:inline-size;overflow:hidden}
.sheet .ttl{position:absolute;left:4.8%;right:4.8%;top:2.2%;font:500 3.2cqw/1.3 Barlow,Arial,sans-serif;text-align:center;border:0;background:transparent;color:#111;padding:.4cqw;border-radius:0}
.sheet .ttl:focus{outline:2px solid var(--yellow);outline-offset:0}
.cell{position:absolute;background:#fff;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain;display:block}
.cell:hover{outline:2px solid var(--yellow)}
.legph{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw 3cqw;align-content:start}
.legph i{display:block;height:1.1cqw;background:#e6e7e4;border-radius:1px}
.sheet .logo{position:absolute;left:4.8%;bottom:3%;height:4.4%;max-width:22%;object-fit:contain;object-position:left bottom}
.sheet .pnum{position:absolute;right:4.8%;bottom:3.4%;font-size:1.8cqw;color:#666}
.sheet .empty{position:absolute;left:10%;right:10%;top:38%;text-align:center;color:#8a8f94;font-size:3.4cqw;line-height:1.4}
.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pctl .count{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{min-width:36px;height:36px;padding:0 10px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.primary{background:var(--yellow);color:var(--onyellow)}
.btn.danger{color:var(--red)}
.btn.small{height:38px;padding:0 12px;font-size:15px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 35%);display:flex;justify-content:center;align-items:center;gap:10px;z-index:5}
.shoot{position:relative;height:60px;padding:0 28px 0 40px;border-radius:14px;background:var(--yellow);color:#1A1D20;font:700 22px/1 "Barlow Condensed",Barlow,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.shoot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:repeating-linear-gradient(135deg,#1A1D20 0 7px,var(--yellow) 7px 14px)}
.shoot svg.i{width:26px;height:26px}

/* Editor */
#editor{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;flex-direction:column;background:var(--stage);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#editor.on{display:flex}
.etop{display:flex;align-items:center;gap:2px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.etitle{flex:1;min-width:0;font:600 17px "Barlow Condensed",Barlow,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;color:var(--muted)}
.ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.ib:disabled{opacity:.3}
.ib:not(:disabled):hover{background:var(--raise)}
.tb{height:42px;display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:10px;font-weight:600}
.tb.primary{background:var(--yellow);color:#1A1D20;padding:0 12px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 20px);background:rgba(20,22,24,.82);color:#fff;font-size:14px;padding:6px 8px 6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;pointer-events:auto}
#hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);flex:none}
#hint button svg{width:16px;height:16px}
#hint .hsign{width:auto;height:28px;border-radius:999px;padding:0 12px;background:var(--yellow);color:#1A1D20;font-weight:700}
.ebottom{background:var(--panel);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.textrow input{flex:1;min-width:140px;height:40px;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:0 12px}
.textrow input:focus{outline:2px solid var(--yellow);outline-offset:0}
.chips{padding-top:0}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sw{display:flex;gap:6px;flex:none}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.swatch.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swatch.none{background:linear-gradient(135deg,transparent 45%,var(--red) 45% 55%,transparent 55%),var(--raise)}
.tog{height:36px;min-width:44px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;flex:none}
.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{width:1px;height:26px;background:var(--line);flex:none}
.tools{gap:2px;padding:4px 6px 6px}
.tool{flex:1 0 52px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tool.on{background:var(--yellow);color:#1A1D20}
.tool svg.i{width:22px;height:22px}

/* In-app camera */
#cam{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:#000;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color:#fff}
#cam.on{display:flex}
#camWrap{flex:1;position:relative;overflow:hidden}
#camV{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#camFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.camtop{display:flex;align-items:center;gap:8px;padding:8px}
.camtop .ib{color:#fff}
#camInfo{flex:1;font-size:13px;opacity:.7;text-align:center}
.cambar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 18px}
.cambar .tb{color:#fff;background:rgba(255,255,255,.14);min-width:96px;justify-content:center}
.shutter{width:78px;height:78px;border-radius:50%;background:#fff;border:5px solid var(--yellow);box-shadow:0 0 0 3px #000 inset}
.shutter:active{transform:scale(.94)}
#camZoom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.5);border-radius:999px;padding:4px}
#camZoom button{min-width:46px;height:40px;border-radius:999px;color:#fff;font-weight:700;font-size:15px;padding:0 8px}
#camZoom button.on{background:var(--yellow);color:#1A1D20}
@media (orientation:landscape) and (max-height:620px){
  #cam{flex-direction:row;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .camtop{flex-direction:column;justify-content:flex-start;padding:8px 4px}
  #camInfo{display:none}
  .cambar{flex-direction:column-reverse;justify-content:center;gap:18px;padding:8px 14px}
  .cambar .tb{min-width:0}
  .cambar > span{display:none}
  #editor.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,36%);grid-template-rows:auto minmax(0,1fr)}
  .etop{grid-column:1 / -1}
  #stage{grid-column:1;grid-row:2}
  .ebottom{grid-column:2;grid-row:2;overflow-y:auto;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
  .ebottom .row{flex-wrap:wrap;overflow-x:visible}
  .ebottom .sw{flex-wrap:wrap;flex:1 1 100%}
  .ebottom .tools{order:-1}
  .ebottom .tool{flex:0 0 calc(33.3% - 2px)}
}
/* Survey document */
.docbar{max-width:960px;margin:0 auto;padding:0 16px 8px}
#docv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:25;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#docv.on{display:flex}
.dtop{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dtop .etitle{color:var(--ink)}
.dbody{flex:1;overflow:auto;padding:14px 12px 60px}
.dwrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dcard h3{margin:0 0 10px;font:700 21px/1.2 "Barlow Condensed",Barlow,sans-serif}
.dsub{font-weight:700;margin:14px 0 4px}
.dnote{color:var(--muted);font-size:15px;margin:12px 0 0}
.dfield{display:grid;grid-template-columns:minmax(130px,40%) 1fr;gap:10px;align-items:center;padding:3px 0}
.dfield label{color:var(--muted);font-size:15px;text-align:right;line-height:1.25}
.dfield input,.dfield textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--raise);color:var(--ink)}
.dfield textarea{resize:vertical}
.dfield input:focus,.dfield textarea:focus{outline:2px solid var(--yellow);outline-offset:0}
@media (max-width:540px){.dfield{grid-template-columns:1fr;gap:4px}.dfield label{text-align:left}}
.dslots,.dsigs{display:flex;gap:14px;flex-wrap:wrap}
.dslot,.dsig{flex:1 1 220px;min-width:0}
.dl{font-size:14px;color:var(--muted);margin-bottom:6px}
.dslot .pv{aspect-ratio:4/3;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;background:var(--raise);color:var(--muted);font-size:14px}
.dslot .pv.logo{aspect-ratio:4/1}
.dslot .pv img{width:100%;height:100%;object-fit:contain}
.dsig canvas{width:100%;height:auto;aspect-ratio:600/220;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.dbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
/* Overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.panel{background:var(--panel);color:var(--ink);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.ov{align-items:center}.panel{border-radius:18px;max-height:84vh}}
.panel h2{font:700 24px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 4px}
.panel h3{font:600 17px/1.2 Barlow,sans-serif;margin:18px 0 8px;color:var(--muted)}
.panel p{margin:4px 0 12px;color:var(--muted)}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phead h2{flex:1;margin:0}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;text-align:left;width:100%}
.prow:hover{background:var(--raise)}
.prow canvas{flex:none;width:64px;height:34px;background:#5b6166;border-radius:6px}
.prow .lbl{flex:1;min-width:0;font-size:15px;line-height:1.3}
.prow .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--red);flex:none}
.prow .tag{flex:none;width:64px;height:30px;border-radius:6px;background:#fff;color:#111;font-size:11px;display:grid;place-items:center;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field img{max-height:44px;max-width:140px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ink)}
.switch.on::after{left:25px}
.dlg{background:var(--panel);width:calc(100% - 32px);max-width:440px;border-radius:16px;padding:18px;margin:auto}
#dlg{align-items:center}
.dlg h2{font:700 22px "Barlow Condensed",Barlow,sans-serif;margin:0 0 6px}
.dlg p{margin:0 0 12px;color:var(--muted)}
.dlg textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raise);resize:vertical}
.dlg textarea:focus{outline:2px solid var(--yellow);outline-offset:0}
.dlg .actions{justify-content:flex-end}
#preview .panel{max-width:720px}
.pvwrap{background:var(--bg);border-radius:10px;padding:12px;display:flex;justify-content:center}
.pvwrap canvas{width:100%;max-width:520px;height:auto;box-shadow:var(--shadow);background:#fff}
.pvnav{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;z-index:70;background:rgba(10,12,14,.45);display:none;place-items:center;color:#fff;font-weight:600}
#busy.on{display:grid}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="home">
  <header class="hd">
    <div class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
    <input id="projName" placeholder="Project name" aria-label="Project name" autocomplete="off">
    <button id="btnSettings" class="icon-btn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <p class="sub">Six photos per page. Tap a photo to annotate it, tap the title to rename the page. <span style="opacity:.7">Version 1.10</span></p>
  <div class="docbar"><button id="btnDoc" class="btn ghost"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>Site Survey Document</button></div>
  <main id="pages"></main>
  <div class="dock">
    <button id="btnGallery" class="btn ghost" aria-label="Add from gallery"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg></button>
    <button id="btnCamera" class="shoot"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take photo</button>
    <button id="btnExportAll" class="btn ghost"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</button>
  </div>
</div>

<div id="editor" aria-label="Photo editor">
  <div class="etop">
    <button id="eDone" class="ib" aria-label="Done, back to pages"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div id="eTitle" class="etitle"></div>
    <button id="eUndo" class="ib" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="eRedo" class="ib" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="eDel" class="ib" aria-label="Delete selected"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="eMore" class="ib" aria-label="More"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    <button id="eNext" class="tb primary"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Next</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="hint" hidden><span id="hintTxt"></span><button id="hintSign" class="hsign" hidden>Sign</button><button id="hintX" aria-label="Stop using this symbol"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
  <div class="ebottom">
    <div id="textRow" class="row textrow">
      <input id="txt" placeholder="Label text, stays until you change it" autocomplete="off" enterkeyhint="done">
      <button id="tMinus" class="tog" aria-label="Smaller text">A−</button>

  db:null, mem:new Map(),
  async init(){

        const r = indexedDB.open('site-survey-v1', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('photos', {keyPath:'id'}); r.result.createObjectStore('meta'); };

  req(st, mode, f){

  async clearAll(){ if(!this.db){ this.mem.clear(); return; } await this.req('photos','readwrite', s => s.clear()); await this.req('meta','readwrite', s => s.clear()); },
};

/* ---------- drawing ---------- */
const FONT = s => `500 ${s}px Barlow, Arial, sans-serif`;
const mctx = mkCanvas(4,4).getContext('2d');
function norm(a){ return {x:Math.min(a.x, a.x+a.w), y:Math.min(a.y, a.y+a.h), w:Math.abs(a.w), h:Math.abs(a.h)}; }
function wrap(ctx, text, maxW){
  const out = [];
  String(text || ' ').split('\n').forEach(par => {
    const words = par.split(/\s+/).filter(Boolean); if(!words.length){ out.push(''); return; }
    let line = '';
    for(const w of words){ const t = line ? line+' '+w : w; if(ctx.measureText(t).width > maxW && line){ out.push(line); line = w; } else line = t; }
    out.push(line);
  });
  return out;
}
function labelBox(a){
  mctx.font = FONT(a.size);
  const lines = wrap(mctx, a.text, a.maxW);
  const pad = a.size*0.4, lh = a.size*1.22;
  let tw = 0; lines.forEach(l => tw = Math.max(tw, mctx.measureText(l).width));
  return {x:a.x, y:a.y, w:tw+pad*2, h:lines.length*lh+pad*1.3, lines, pad, lh};
}
function edgePoint(b, tx, ty){
  const cx = b.x+b.w/2, cy = b.y+b.h/2, dx = tx-cx, dy = ty-cy;
  if(!dx && !dy) return {x:cx, y:cy, inside:true};
  const t = Math.min(dx ? (b.w/2)/Math.abs(dx) : Infinity, dy ? (b.h/2)/Math.abs(dy) : Infinity);
  return {x:cx+dx*t, y:cy+dy*t, inside:t >= 1};

function rotPt(px, py, cx, cy, ang){ const c = Math.cos(ang), s = Math.sin(ang), dx = px-cx, dy = py-cy; return {x:cx+dx*c-dy*s, y:cy+dx*s+dy*c}; }
function leaderStart(a, b){
  const rot = a.rot || 0, cx = b.x+b.w/2, cy = b.y+b.h/2;
  const lt = rotPt(a.ax, a.ay, cx, cy, -rot), e = edgePoint(b, lt.x, lt.y), w = rotPt(e.x, e.y, cx, cy, rot);
  return {x:w.x, y:w.y, inside:e.inside};
}
function boxFrame(a){
  if(!a) return null;
  if(isBoxT(a.t)){ const r = norm(a); return {cx:r.x+r.w/2, cy:r.y+r.h/2, w:r.w, h:r.h, rot:a.rot || 0}; }

  return null;
}
function arrowHead(ctx, x1, y1, x2, y2, size, color){
  const ang = Math.atan2(y2-y1, x2-x1);
  ctx.save(); ctx.setLineDash([]); ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - size*Math.cos(ang-0.42), y2 - size*Math.sin(ang-0.42));
  ctx.lineTo(x2 - size*Math.cos(ang+0.42), y2 - size*Math.sin(ang+0.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function strokeLine(ctx, a, x1, y1, x2, y2, head){
  ctx.lineWidth = a.sw; ctx.strokeStyle = a.stroke;
  ctx.setLineDash(a.dash ? [a.sw*2.6, a.sw*1.9] : []); ctx.lineCap = a.dash ? 'butt' : 'round';
  const hs = a.sw*4.2, len = Math.hypot(x2-x1, y2-y1);
  let ex = x2, ey = y2;
  if(head && len > 0){ const k = Math.max(0, len - hs*0.75)/len; ex = x1+(x2-x1)*k; ey = y1+(y2-y1)*k; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(ex, ey); ctx.stroke();
  if(head && len > 0) arrowHead(ctx, x1, y1, x2, y2, hs, a.stroke);
}
function drawAnn(ctx, a){
  ctx.save(); ctx.lineJoin = 'round';
  if(a.t === 'rect' || a.t === 'ellipse'){
    const r = norm(a); ctx.translate(r.x+r.w/2, r.y+r.h/2); if(a.rot) ctx.rotate(a.rot); ctx.beginPath();
    if(a.t === 'rect') ctx.rect(-r.w/2, -r.h/2, r.w, r.h);
    else ctx.ellipse(0, 0, Math.max(r.w/2, .5), Math.max(r.h/2, .5), 0, 0, Math.PI*2);
    if(a.fill){ ctx.fillStyle = a.fill; ctx.fill(); }
    if(a.stroke){ ctx.lineWidth = a.sw; ctx.strokeStyle = a.stroke; ctx.setLineDash(a.dash ? [a.sw*2.6, a.sw*1.9] : []); ctx.stroke(); }
  } else if(a.t === 'sign'){
    const r = norm(a), g = signGeom(a);
    ctx.translate(r.x+r.w/2, r.y+r.h/2); if(a.rot) ctx.rotate(a.rot); ctx.translate(-r.w/2, -r.h/2);
    ctx.setLineDash([]); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.w, r.h);
    ctx.lineWidth = Math.max(1, r.h*0.006); ctx.strokeStyle = '#111'; ctx.strokeRect(0, 0, r.w, r.h);
    ctx.fillStyle = '#111'; ctx.font = '600 '+g.fs+'px Barlow, Arial, sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    g.lines.forEach((l, i) => ctx.fillText(l, g.pad, g.pad*0.8+i*g.fs*1.2));
    ctx.strokeStyle = '#9aa0a6'; ctx.lineWidth = Math.max(1, r.h*0.004); ctx.strokeRect(g.ix, g.iy, g.iw, g.ih);

    }
  } else if(a.t === 'line' || a.t === 'arrow'){
    strokeLine(ctx, a, a.x1, a.y1, a.x2, a.y2, a.t === 'arrow');
  } else if(a.t === 'pen'){
    const p = a.pts; if(p.length){
      ctx.lineWidth = a.sw; ctx.strokeStyle = a.stroke; ctx.lineCap = a.dash ? 'butt' : 'round';
      ctx.setLineDash(a.dash ? [a.sw*2.6, a.sw*1.9] : []);
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for(let i = 1; i < p.length-1; i++){ const mx = (p[i][0]+p[i+1][0])/2, my = (p[i][1]+p[i+1][1])/2; ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my); }

/* ---------- page geometry & export ---------- */
const PW = 1654, PH = 2339, PM = 84;
function legendItems(pg){
  const used = new Set();

  return S.presets.filter(p => SHAPES.includes(p.kind) && used.has(p.id));
}
function layoutCells(n, A, layout){
  const g = 20, cells = [];
  const grid = (n, R, cols) => {
    const rows = Math.ceil(n/cols), cw = (R.w-g*(cols-1))/cols, ch = (R.h-g*(rows-1))/rows;
    for(let i = 0; i < n; i++) cells.push({x:R.x+(i%cols)*(cw+g), y:R.y+Math.floor(i/cols)*(ch+g), w:cw, h:ch});
  };
  if(!n) return cells;
  if(layout === 'hero' && n > 1){
    const hh = n <= 3 ? A.h*0.56 : A.h*0.42;
    cells.push({x:A.x, y:A.y, w:A.w, h:hh});
    grid(n-1, {x:A.x, y:A.y+hh+g, w:A.w, h:A.h-hh-g}, n-1 === 1 ? 1 : 2);
  } else grid(n, A, n <= 2 ? 1 : 2);
  return cells;
}
function pageGeometry(pg){
  const top = PM + 96, footH = 104;
  let bottom = PH - PM - footH;
  const items = S.project.legend ? legendItems(pg) : [];
  let leg = null;
  if(items.length){ const rows = Math.ceil(items.length/2), h = rows*64 + 30; bottom -= h; leg = {x:PM, y:bottom+24, w:PW-2*PM, h:h-24, items}; }
  const cells = layoutCells(pg.photos.length, {x:PM, y:top, w:PW-2*PM, h:bottom-top}, pg.layout);
  return {cells, leg};
}
async function fontsReady(){ try{ await document.fonts.load(FONT(20)); await document.fonts.ready; }catch(e){} }
async function composite(rec, maxDim){
  const img = await loadImg(rec), k = Math.min(1, maxDim/Math.max(rec.w, rec.h));
  const c = mkCanvas(rec.w*k, rec.h*k), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high'; x.scale(k, k); x.drawImage(img, 0, 0, rec.w, rec.h);

}
function fitFont(x, text, maxW, size, min){ let s = size; x.font = FONT(s); while(s > min && x.measureText(text).width > maxW){ s -= 2; x.font = FONT(s); } return s; }
async function renderPage(pi){

    } else {

    try{ const li = await loadDataImg(S.project.logo); const k = Math.min(340/li.width, 86/li.height); x.drawImage(li, PM, PH-PM-li.height*k, li.width*k, li.height*k); }catch(e){}
  }

  x.fillText(`${S.project.name ? S.project.name+'   ' : ''}Page ${pi+1} of ${S.pages.length}`, PW-PM, PH-PM-10);

}
function cropRect(rec, cell){
  const a = cell.w/cell.h; let w = rec.w, h = rec.h;
  if(rec.w/rec.h > a) w = rec.h*a; else h = rec.w/a;
  let cx = rec.w/2, cy = rec.h/2;
  const anns = rec.anns || [];

    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    anns.forEach(an => { const b = bbox(an); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x+b.w); y2 = Math.max(y2, b.y+b.h); });
    cx = (x1+x2)/2; cy = (y1+y2)/2;

  return {x:clamp(cx-w/2, 0, rec.w-w), y:clamp(cy-h/2, 0, rec.h-h), w, h};
}
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function exportPDF(indexes){
  if(!window.jspdf){ toast('The PDF library didn’t load. Check your connection and reload.'); return; }
  const list = indexes.filter(i => S.pages[i] && S.pages[i].photos.length);

/* ---------- photos & pages ---------- */
async function decodeScaled(file, MAX){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, {resizeWidth:MAX, resizeQuality:'medium', imageOrientation:'from-image'}); }catch(e){}
    try{ return await createImageBitmap(file); }catch(e){}
  }
  const url = URL.createObjectURL(file);
  try{ return await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('This file isn’t an image the browser can open.')); i.src = url; }); }
  finally{ setTimeout(() => URL.revokeObjectURL(url), 1000); }
}
async function fileToCanvas(file){
  const MAX = 2048, src = await decodeScaled(file, MAX);
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  if(!sw || !sh) throw new Error('This file isn’t an image the browser can open.');
  const k = Math.min(1, MAX/Math.max(sw, sh)), c = mkCanvas(sw*k, sh*k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  if(src.close) src.close();
  return c;
}
async function ingest(file){ return addCanvasPhoto(await fileToCanvas(file)); }
function finishPhoto(rec, c){
  const w = c.width, h = c.height;
  const t = mkCanvas(w*480/Math.max(w,h), h*480/Math.max(w,h)); t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  rec.w = w; rec.h = h; rec.thumb = t.toDataURL('image/jpeg', 0.75); rec.blob = null;
  imgCache.set(rec.id, Promise.resolve(c));
  setTimeout(() => {
    canvasBlob(c, 'image/jpeg', 0.88)
      .then(blob => { rec.blob = blob; return store.put('photos', rec); })
      .catch(() => toast('Couldn’t save this photo. Storage may be full.'));
  }, 400);
}
function addCanvasPhoto(c){
  const rec = {id:uid(), blob:null, w:c.width, h:c.height, anns:[], thumb:''};
  photos.set(rec.id, rec); finishPhoto(rec, c); return rec;
}
function scaleAnns(anns, fx, fy, fu){
  return clone(anns || []).map(a => {
    ['x','x1','x2','ax'].forEach(k => { if(a[k] !== undefined) a[k] *= fx; });
    ['y','y1','y2','ay'].forEach(k => { if(a[k] !== undefined) a[k] *= fy; });
    if(a.w !== undefined) a.w *= fx; if(a.h !== undefined) a.h *= fy;
    if(a.pts) a.pts = a.pts.map(q => [q[0]*fx, q[1]*fy]);
    if(a.sw) a.sw *= fu; if(a.size){ a.size *= fu; a.maxW *= fu; }
    return a;
  });
}
function replaceImage(rec, c){
  rec.anns = scaleAnns(rec.anns, c.width/rec.w, c.height/rec.h, Math.max(c.width, c.height)/Math.max(rec.w, rec.h));
  finishPhoto(rec, c);
}
let replaceId = null;
function quietDownload(name, blob){

  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 8000);
}
function backupName(){ const d = new Date(), z = n => String(n).padStart(2, '0'); return `${fileBase()}-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.jpg`; }
function nextTitle(t){ const m = /^(\D*?)(\d+)/.exec(t || ''); return m ? t.replace(m[0], m[1] + (parseInt(m[2], 10)+1)) : (t || ''); }
function placePhoto(id, pi){

  if(i < 0){ const last = S.pages.length-1; i = S.pages[last].photos.length < 6 ? last : -1; }
  if(i < 0){ const prev = S.pages[S.pages.length-1]; const p = newPage(nextTitle(prev.title)); p.layout = prev.layout; p.fit = prev.fit; S.pages.push(p); i = S.pages.length-1; }

const CAM = {stream:null, devices:[], idx:0};
function stopStream(){ if(CAM.stream){ CAM.stream.getTracks().forEach(t => t.stop()); CAM.stream = null; } $('#camV').srcObject = null; }
async function startStream(){
  stopStream();
  const size = {width:{ideal:4096}, height:{ideal:3072}};
  const dev = CAM.devices[CAM.idx] ? CAM.devices[CAM.idx].deviceId : S.camDevice;
  const video = dev ? {deviceId:{exact:dev}, ...size} : {facingMode:{ideal:'environment'}, ...size};
  try{ CAM.stream = await navigator.mediaDevices.getUserMedia({audio:false, video}); }
  catch(e){ if(!dev) throw e; S.camDevice = null; CAM.devices = []; CAM.stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, ...size}}); }
  const v = $('#camV'); v.srcObject = CAM.stream; try{ await v.play(); }catch(e){}
  const tr = CAM.stream.getVideoTracks()[0], st = tr.getSettings();
  if(!CAM.devices.length){
    try{
      const all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const back = all.filter(d => /back|rear|environment|achter|arrière/i.test(d.label));
      CAM.devices = back.length ? back : all;
      CAM.idx = Math.max(0, CAM.devices.findIndex(d => d.deviceId === st.deviceId));
    }catch(e){}
  }
  if(st.deviceId){ S.camDevice = st.deviceId; saveMeta(); }
  $('#camLens').hidden = CAM.devices.length < 2;
  $('#camLens').textContent = `Lens ${CAM.idx+1} of ${CAM.devices.length}`;
  $('#camInfo').textContent = st.width ? `${Math.max(st.width, st.height)} × ${Math.min(st.width, st.height)}` : '';
  setupZoom();
}
function setupZoom(){
  const z = $('#camZoom'), tr = CAM.stream && CAM.stream.getVideoTracks()[0];
  let cap = {}; try{ cap = tr && tr.getCapabilities ? tr.getCapabilities() : {}; }catch(e){}
  if(!cap.zoom || !(cap.zoom.max > cap.zoom.min)){ z.hidden = true; return; }
  const mn = cap.zoom.min, mx = cap.zoom.max;
  const opts = [...new Set([mn < 1 ? Math.round(mn*10)/10 : null, 1, 2].filter(v => v != null && v >= mn-0.01 && v <= mx+0.01))];
  if(opts.length < 2){ z.hidden = true; return; }
  const apply = async v => { try{ await tr.applyConstraints({advanced:[{zoom:v}]}); S.camZoom = v; saveMeta(); }catch(e){} mark(); };
  const mark = () => { let cur = 1; try{ cur = tr.getSettings().zoom || 1; }catch(e){} [...z.children].forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.z - cur) < 0.05)); };
  z.innerHTML = opts.map(v => `<button data-z="${v}">${String(v).replace('.', ',')}×</button>`).join('');
  [...z.children].forEach(b => b.onclick = () => apply(+b.dataset.z));
  z.hidden = false;
  if(S.camZoom && opts.includes(S.camZoom)) apply(S.camZoom); else mark();
}
function goFull(){ try{ if(!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen({navigationUI:'hide'}).catch(() => {}); }catch(e){} }
function leaveFull(){ try{ if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); }catch(e){} }

  const ids = flatIds();
  if(!ids.length && !docRecs.size && !Object.keys(S.doc.f || {}).length){ toast('There’s nothing to export yet.'); return; }
  busy(true, 'Packing project…');
  try{
    const out = {app:'site-survey', format:1, exported:new Date().toISOString(), state:{project:S.project, pages:S.pages, presets:S.presets, doc:S.doc}, photos:[], docImgs:[]};
    for(let n = 0; n < ids.length; n++){

      const r = photos.get(ids[n]); if(!r) continue;
      let blob = r.blob;
      if(!blob){ const img = await loadImg(r), c = mkCanvas(r.w, r.h); c.getContext('2d').drawImage(img, 0, 0, r.w, r.h); blob = await canvasBlob(c, 'image/jpeg', 0.88); }
      out.photos.push({id:r.id, w:r.w, h:r.h, anns:r.anns || [], thumb:r.thumb, jpg:await blobToDataURL(blob)});
    }
    for(const [k, r] of docRecs){ let b = r.blob; if(!b){ const img = await loadImg(r), c = mkCanvas(r.w, r.h); c.getContext('2d').drawImage(img, 0, 0, r.w, r.h); b = await canvasBlob(c, 'image/jpeg', 0.88); } out.docImgs.push({id:k, w:r.w, h:r.h, thumb:r.thumb, jpg:await blobToDataURL(b)}); }

}

  c.onpointerdown = e => { e.preventDefault(); try{ c.setPointerCapture(e.pointerId); }catch(_){} cur = [pt(e)]; strokes.push(cur); draw(); };
  c.onpointermove = e => { if(!cur) return; cur.push(pt(e)); draw(); };
  c.onpointerup = c.onpointercancel = () => { cur = null; };
  const close = () => { ov.classList.remove('on'); c.onpointerdown = c.onpointermove = c.onpointerup = c.onpointercancel = null; };
  $('#sigClear').onclick = () => { strokes = []; draw(); };
  $('#sigNo').onclick = close;
  $('#sigOk').onclick = () => { snap(); o.strokes = strokes.map(st => st.map(q => [+q[0].toFixed(4), +q[1].toFixed(4)])); close(); changed(); };
  ov.classList.add('on'); draw();
}

function applyPreset(p){
  const o = selObj();
  if(p.kind === 'sign'){
    const w = E.rec.w*0.46, h = w*0.5;
    const a = {id:uid(), t:'sign', title:p.label, x:E.rec.w-w-E.rec.w*0.03, y:E.rec.h-h-E.rec.h*0.04, w, h, rot:0, strokes:[], preset:null};
    snap(); E.anns.push(a); E.sel = a.id; setTool('select'); S.activePreset = null; saveMeta(); changed(); return;
  }
  if(p.kind === 'callout' || p.kind === 'text'){
    setTool(p.kind); S.text = p.label; S.activePreset = null;
    if(p.stroke) rememberStyle(p.kind, 'color', p.stroke);
    if(isLabel(o)){ snap(); o.text = p.label; changed(); }
    addRecent(p.label);
  } else {
    setTool(p.kind); rememberStyle(p.kind, 'color', p.stroke); rememberStyle(p.kind, 'fill', p.fill || null); rememberStyle(p.kind, 'dash', !!p.dash); S.activePreset = p.id;
    if(o && o.t === p.kind){ snap(); o.stroke = p.stroke; o.fill = p.fill || null; o.dash = !!p.dash; o.preset = p.id; changed(); }
    else E.sel = null;
  }
  saveMeta(); render(); updateUI();
}

    <div class="actions"><button class="btn ghost" data-newsym>${svg('plus')}Symbol from current style</button><button class="btn ghost" data-newlbl>${svg('plus')}New label</button></div>`,
    pn => {
      pn.querySelectorAll('.prow canvas').forEach(c => { const p = S.presets.find(x => x.id === c.parentElement.dataset.id); drawSymbol(c.getContext('2d'), p, 6, 4, 116, 60); });
      pn.querySelector('[data-close]').onclick = () => closeSheet('sheet');
      pn.querySelector('[data-edit]').onclick = () => { edit = !edit; draw(); };
      pn.querySelectorAll('[data-rm]').forEach(b => b.onclick = e => { e.stopPropagation(); S.presets = S.presets.filter(p => p.id !== b.dataset.rm); if(S.activePreset === b.dataset.rm) S.activePreset = null; saveMeta(); draw(); });
      pn.querySelectorAll('.prow[data-id]').forEach(r => {
        const act = async () => {
          const p = S.presets.find(x => x.id === r.dataset.id); if(!p) return;
          if(edit){ const t = await askText('Rename', p.label, 'Save'); if(t){ p.label = t; saveMeta(); } draw(); return; }
          closeSheet('sheet'); if(E.rec) applyPreset(p);
        };
        r.onclick = act; r.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act(); } };
      });
      pn.querySelector('[data-newsym]').onclick = async () => {
        const o = selObj(), src = o && SHAPES.includes(o.t) ? o : null;
        const kind = src ? src.t : (SHAPES.includes(S.tool) ? S.tool : 'arrow');
        const t = await askText('Legend text for this symbol', '', 'Save'); if(!t){ draw(); return; }
        const p = {id:uid(), kind, label:t, stroke:src ? src.stroke : S.style.color, fill:src ? (src.fill || null) : S.style.fill, dash:src ? !!src.dash : S.style.dash};
        S.presets.splice(S.presets.findIndex(x => x.kind === 'callout') < 0 ? S.presets.length : S.presets.findIndex(x => x.kind === 'callout'), 0, p);
        if(src){ snap(); src.preset = p.id; changed(); }
        saveMeta(); draw();
      };
      pn.querySelector('[data-newlbl]').onclick = async () => {
        const t = await askText('New label', '', 'Save'); if(t){ S.presets.push({id:uid(), kind:'callout', stroke:'#E3201B', label:t}); saveMeta(); }
        draw();
      };
    });
  draw();
}

    });

  });
  const aTop = r;

  wrap(x, fv('actions'), C1-DL-30).slice(0, 5).forEach((l, i) => dText(x, l, DL+12, r+66+i*30, {font:DF(21), color:DBLUE}));

  r += 230;

async function dPage4(n){
  const {c, x} = await dChrome(n), W = DR-DL, top = 140, bot = DH-130;
  dBox(x, DL, top, W, bot-top);
  dText(x, tr('annex1'), DW/2, top+66, {font:DSER(40), align:'center'}); dLine(x, DL+6, top+94, DR-6, top+94);
  dText(x, tr('traceRoute'), DW/2, top+128, {font:DFB(22), align:'center'}); dLine(x, DL+6, top+146, DR-6, top+146);

async function dTrace(n, pg, key){
  const {c, x} = await dChrome(n);
  dText(x, tr(key), DL, 182, {font:DSER(36)});
  const A = {x:DL, y:225, w:DR-DL, h:DH-160-225};
  const recs = pg.photos.map(id => photos.get(id)).filter(Boolean), cells = layoutCells(recs.length, A, pg.layout);
  for(let i = 0; i < recs.length; i++){
    const rec = recs[i], cp = await composite(rec, 1800), cl = cells[i];
    if(pg.fit === 'fill'){ const q = cropRect(rec, cl), f = cp.width/rec.w; x.drawImage(cp, q.x*f, q.y*f, q.w*f, q.h*f, cl.x, cl.y, cl.w, cl.h); }
    else dContain(x, cp, cl);
  }
  return c;
}
function legSym(x, k, cx, cy){
  const G = '#19E619', C = '#14E8F0', R = '#E3201B', Y = '#FFF200';
  x.save(); x.lineCap = 'butt';
  const ring = () => { x.strokeStyle = C; x.lineWidth = 6; x.beginPath(); x.arc(cx, cy, 24, 0, Math.PI*2); x.stroke(); };
  switch(k){
    case 'hhOld': x.fillStyle = G; x.fillRect(cx-19, cy-19, 38, 38); x.strokeStyle = '#fff'; x.lineWidth = 2.5; x.strokeRect(cx-12, cy-12, 24, 24); x.beginPath(); x.moveTo(cx-12, cy-12); x.lineTo(cx+12, cy+12); x.moveTo(cx+12, cy-12); x.lineTo(cx-12, cy+12); x.stroke(); break;
    case 'kopOld': x.fillStyle = G; x.beginPath(); x.arc(cx, cy, 18, 0, Math.PI*2); x.fill(); x.fillStyle = '#fff'; [[-6,-6],[6,-6],[-6,6],[6,6]].forEach(([a, b]) => { x.beginPath(); x.arc(cx+a, cy+b, 3.4, 0, Math.PI*2); x.fill(); }); break;
    case 'pipeOld': x.strokeStyle = R; x.lineWidth = 7; x.beginPath(); x.moveTo(cx-56, cy+10); x.lineTo(cx+56, cy+10); x.stroke(); break;
    case 'hhNew': x.fillStyle = C; x.fillRect(cx-88, cy-38, 176, 76); break;
    case 'kopNew': x.strokeStyle = R; x.lineWidth = 3; x.beginPath(); x.ellipse(cx, cy, 36, 28, 0, 0, Math.PI*2); x.stroke(); break;
    case 'traceNew': x.strokeStyle = Y; x.lineWidth = 6; x.beginPath(); x.moveTo(cx-52, cy); x.lineTo(cx+34, cy); x.stroke(); arrowHead(x, cx-52, cy, cx+52, cy, 24, Y); break;
    case 'mantel': x.fillStyle = G; x.fillRect(cx-52, cy-4, 104, 26); break;
    case 'boreM': ring(); dText(x, 'G', cx, cy+8, {font:'bold 22px Arial, sans-serif', color:C, align:'center'}); x.fillStyle = R; x.fillRect(cx-7, cy+11, 14, 2.5); break;
    case 'bore': ring(); dText(x, 'G', cx, cy+10, {font:'bold 28px Arial, sans-serif', color:C, align:'center'}); break;
    case 'press': ring(); x.fillStyle = C; x.beginPath(); x.moveTo(cx-9, cy+10); x.lineTo(cx-9, cy-1); x.arc(cx, cy-1, 9, Math.PI, 0); x.lineTo(cx+9, cy+10); x.lineTo(cx+4, cy+10); x.lineTo(cx+4, cy+2); x.lineTo(cx-4, cy+2); x.lineTo(cx-4, cy+10); x.closePath(); x.fill(); break;
    case 'layM': ring(); x.fillStyle = C; x.fillRect(cx-3.5, cy-2, 7, 13); break;
    case 'filo': x.strokeStyle = R; x.lineWidth = 6; x.setLineDash([5, 5]); x.beginPath(); x.arc(cx, cy, 24, 0, Math.PI*2); x.stroke(); break;
    case 'cpe': x.strokeStyle = R; x.lineWidth = 6; x.strokeRect(cx-46, cy-28, 92, 56); dText(x, 'CPE +', cx, cy-4, {font:'15px Arial, sans-serif', align:'center'}); dText(x, 'WODF', cx, cy+16, {font:'15px Arial, sans-serif', align:'center'}); break;
    case 'budi': x.strokeStyle = R; x.lineWidth = 6; x.strokeRect(cx-24, cy-34, 48, 68); dText(x, 'BUDI', cx, cy-14, {font:'14px Arial, sans-serif', align:'center'}); break;
  }
  x.restore();
}
async function dLegend(n){
  const {c, x} = await dChrome(n), top = 225, rh = 128, cx = (DL+DR)/2, L = LI();
  dText(x, tr('legend'), DL, 182, {font:DSER(36)});
  x.strokeStyle = '#111'; x.lineWidth = 1.6;
  LEG.forEach(([k, lab], i) => {
    const y = top+i*rh; x.strokeRect(DL, y, DR-DL, rh);
    legSym(x, k, (DL+cx)/2, y+rh/2);
    dText(x, lab[L], cx+30, y+rh/2+9, {font:DF(26), maxW:DR-cx-50});
  });
  dLine(x, cx, top, cx, top+LEG.length*rh, 1.6);
  return c;
}
const pageSec = pg => pg.sec || 'ext';
function docJobs(){
  const jobs = [dPage1, dPage2, dPage3, dPage4];
  S.pages.filter(p => pageSec(p) === 'ext' && p.photos.length).forEach(pg => jobs.push(n => dTrace(n, pg, 'annex2')));
  S.pages.filter(p => pageSec(p) === 'int' && p.photos.length).forEach(pg => jobs.push(n => dTrace(n, pg, 'annex3')));
  jobs.push(dLegend);
  return jobs;
}
async function exportDocPDF(){
  if(!window.jspdf){ toast('The PDF library didn’t load. Check your connection and reload.'); return; }
  await fontsReady();
  const jobs = docJobs(); busy(true, 'Building document…');
  try{
    const pdf = new window.jspdf.jsPDF({orientation:'p', unit:'mm', format:'a4', compress:true});
    for(let i = 0; i < jobs.length; i++){
      busy(true, `Building document, page ${i+1} of ${jobs.length}…`);
      const c = await jobs[i](i+1); if(i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297); c.width = c.height = 1;
    }
    const blob = pdf.output('blob'); busy(false);
    await saveFile(`${fileBase()}-site-survey-${S.doc.lang}.pdf`, blob);
  }catch(e){ busy(false); toast('Document export failed: ' + (e.message || e)); }
}
async function previewDoc(){
  await fontsReady();

  try{
    for(let i = 0; i < jobs.length; i++){
      busy(true, `Rendering page ${i+1} of ${jobs.length}…`);
      const c = await jobs[i](i+1), s = mkCanvas(900, 900*DH/DW); s.getContext('2d').drawImage(c, 0, 0, s.width, s.height); c.width = c.height = 1;

    <p>${imgs.length} pages</p><div style="display:flex;flex-direction:column;gap:14px">${imgs.map(u => `<img src="${u}" alt="" style="width:100%;box-shadow:var(--shadow);background:#fff">`).join('')}</div>
    <div class="actions"><button class="btn primary" data-pdf>${svg('dl')}Save as PDF</button></div>`, p => {
    p.querySelector('[data-close]').onclick = () => closeSheet('preview');
    p.querySelector('[data-pdf]').onclick = () => exportDocPDF();
  });
}
async function setDocImage(key, c){
  const t = mkCanvas(c.width*480/Math.max(c.width, c.height), c.height*480/Math.max(c.width, c.height)); t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);

}
async function clearDocImage(key){ docRecs.delete(key); imgCache.delete(key); await store.del('photos', key).catch(() => {}); }
let docSlotKey = null;
function openPad(title, strokes, aspect, onSave){
  const ov = $('#sigpad'), c = $('#sigCv'), x = c.getContext('2d');
  const maxW = Math.min(window.innerWidth-72, 600), maxH = Math.min(window.innerHeight*0.5, 360);
  let w = maxW, h = w/aspect; if(h > maxH){ h = maxH; w = h*aspect; }
  const dpr = window.devicePixelRatio || 1; c.width = Math.round(w*dpr); c.height = Math.round(h*dpr); c.style.width = w+'px'; c.style.height = h+'px';
  $('#sigT').textContent = title;
  let st = clone(strokes || []), cur = null;
  const draw = () => { x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); x.strokeStyle = '#1b2a6b'; x.lineWidth = 2.5; x.lineCap = 'round'; x.lineJoin = 'round';
    st.forEach(s => { x.beginPath(); s.forEach((q, i) => i ? x.lineTo(q[0]*w, q[1]*h) : x.moveTo(q[0]*w, q[1]*h)); if(s.length === 1) x.lineTo(s[0][0]*w+.5, s[0][1]*h); x.stroke(); }); };
  const pt = e => { const r = c.getBoundingClientRect(); return [clamp((e.clientX-r.left)/r.width, 0, 1), clamp((e.clientY-r.top)/r.height, 0, 1)]; };
  c.onpointerdown = e => { e.preventDefault(); try{ c.setPointerCapture(e.pointerId); }catch(_){} cur = [pt(e)]; st.push(cur); draw(); };
  c.onpointermove = e => { if(!cur) return; cur.push(pt(e)); draw(); };
  c.onpointerup = c.onpointercancel = () => { cur = null; };
  const close = () => { ov.classList.remove('on'); c.onpointerdown = c.onpointermove = c.onpointerup = c.onpointercancel = null; };
  $('#sigClear').onclick = () => { st = []; draw(); };
  $('#sigNo').onclick = close;
  $('#sigOk').onclick = () => { onSave(st.map(s => s.map(q => [+q[0].toFixed(4), +q[1].toFixed(4)]))); close(); };
  ov.classList.add('on'); draw();
}
function pickSurveyPhoto(onPick){

}
function sigPreview(c, strokes){ const x = c.getContext('2d'); c.width = 600; c.height = 220; x.fillStyle = '#fff'; x.fillRect(0, 0, 600, 220); dStrokes(x, strokes, 10, 10, 580, 200); }

      <div class="dbtns"><button class="btn ghost small" data-logo>Upload</button>${S.doc.logo ? '<button class="btn small danger" data-nologo>Remove</button>' : ''}</div></div>

  form.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { docSlotKey = b.dataset.up; $('#docImgIn').click(); });

  form.querySelector('[data-logo]').onclick = () => $('#docLogoIn').click();

/* ---------- boot ---------- */
(async () => {
  await store.init();
  try{
    const m = await store.get('meta', 'state');
    if(m){ const d = defaultState(); S = {...d, ...m, project:{...d.project, ...(m.project||{})}, style:{...d.style, ...(m.style||{})}}; if(!S.pages || !S.pages.length) S.pages = [newPage()]; }

  S.doc = {...DOC_DEFAULT(), ...(S.doc || {})}; S.doc.f = S.doc.f || {};

  for(const pg of S.pages){
    const keep = [];
    for(const id of pg.photos){ try{ const r = await store.get('photos', id); if(r){ photos.set(id, r); keep.push(id); } }catch(e){} }

  }

  if(!store.db) toast('Storage is unavailable here, so photos last only until you close this page.');
