<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E4E6E1;--panel:#F8F8F5;--raise:#FFFFFF;--ink:#1A1D20;--muted:#5C6268;--line:#C8CCC6;
  --yellow:#FFD21F;--onyellow:#1A1D20;--red:#D7261E;--stage:#2B2F33;
  --shadow:0 1px 0 rgba(0,0,0,.05),0 10px 26px rgba(30,35,40,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1F22;--panel:#25292D;--raise:#2E3337;--ink:#ECEDE9;--muted:#A0A7AD;--line:#3A4045;--stage:#141618;
    --shadow:0 10px 26px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1F22;--panel:#25292D;--raise:#2E3337;--ink:#ECEDE9;--muted:#A0A7AD;--line:#3A4045;--stage:#141618;
  --shadow:0 10px 26px rgba(0,0,0,.5);color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* Home */
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:960px;margin:0 auto}
.mark{width:36px;height:36px;flex:none;border-radius:8px;background:var(--yellow);display:grid;place-items:center;color:#1A1D20}
#projName{flex:1;min-width:0;font:600 26px/1.1 "Barlow Condensed",Barlow,sans-serif;border:0;background:transparent;padding:6px 2px;border-bottom:2px solid transparent;border-radius:0}
#projName::placeholder{color:var(--muted)}
#projName:focus{outline:none;border-bottom-color:var(--yellow)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.icon-btn:hover{background:var(--raise)}
.sub{max-width:960px;margin:0 auto;padding:0 18px 8px;color:var(--muted);font-size:15px}
#pages{max-width:960px;margin:0 auto;padding:10px 16px 130px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 26px}
.page{display:flex;flex-direction:column;gap:12px}
.sheet{position:relative;aspect-ratio:1654/2339;background:#fff;color:#111;box-shadow:var(--shadow);container-type:inline-size;overflow:hidden}
.sheet .ttl{position:absolute;left:4.8%;right:4.8%;top:2.2%;font:500 3.2cqw/1.3 Barlow,Arial,sans-serif;text-align:center;border:0;background:transparent;color:#111;padding:.4cqw;border-radius:0}
.sheet .ttl:focus{outline:2px solid var(--yellow);outline-offset:0}
.cell{position:absolute;background:#fff;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain;display:block}
.cell:hover{outline:2px solid var(--yellow)}
.legph{position:absolute;display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw 3cqw;align-content:start}
.legph i{display:block;height:1.1cqw;background:#e6e7e4;border-radius:1px}
.sheet .logo{position:absolute;left:4.8%;bottom:3%;height:4.4%;max-width:22%;object-fit:contain;object-position:left bottom}
.sheet .pnum{position:absolute;right:4.8%;bottom:3.4%;font-size:1.8cqw;color:#666}
.sheet .empty{position:absolute;left:10%;right:10%;top:38%;text-align:center;color:#8a8f94;font-size:3.4cqw;line-height:1.4}
.pctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pctl .count{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:2px;flex:none}
.seg button{min-width:36px;height:36px;padding:0 10px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;font-weight:600;white-space:nowrap}
.btn.ghost{background:var(--raise);border:1px solid var(--line)}
.btn.primary{background:var(--yellow);color:var(--onyellow)}
.btn.danger{color:var(--red)}
.btn.small{height:38px;padding:0 12px;font-size:15px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 35%);display:flex;justify-content:center;align-items:center;gap:10px;z-index:5}
.shoot{position:relative;height:60px;padding:0 28px 0 40px;border-radius:14px;background:var(--yellow);color:#1A1D20;font:700 22px/1 "Barlow Condensed",Barlow,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.shoot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:repeating-linear-gradient(135deg,#1A1D20 0 7px,var(--yellow) 7px 14px)}
.shoot svg.i{width:26px;height:26px}

/* Editor */
#editor{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none;flex-direction:column;background:var(--stage);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#editor.on{display:flex}
.etop{display:flex;align-items:center;gap:2px;padding:6px;background:var(--panel);border-bottom:1px solid var(--line)}
.etitle{flex:1;min-width:0;font:600 17px "Barlow Condensed",Barlow,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;color:var(--muted)}
.ib{width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
.ib:disabled{opacity:.3}
.ib:not(:disabled):hover{background:var(--raise)}
.tb{height:42px;display:inline-flex;align-items:center;gap:4px;padding:0 10px;border-radius:10px;font-weight:600}
.tb.primary{background:var(--yellow);color:#1A1D20;padding:0 12px}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 20px);background:rgba(20,22,24,.82);color:#fff;font-size:14px;padding:6px 8px 6px 12px;border-radius:999px;display:flex;align-items:center;gap:6px;pointer-events:auto}
#hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hint button{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.15);flex:none}
#hint button svg{width:16px;height:16px}
.ebottom{background:var(--panel);border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.textrow input{flex:1;min-width:140px;height:40px;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:0 12px}
.textrow input:focus{outline:2px solid var(--yellow);outline-offset:0}
.chips{padding-top:0}
.chip{flex:none;height:32px;padding:0 12px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:14px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sw{display:flex;gap:6px;flex:none}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.swatch.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.swatch.none{background:linear-gradient(135deg,transparent 45%,var(--red) 45% 55%,transparent 55%),var(--raise)}
.tog{height:36px;min-width:44px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;flex:none}
.tog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{width:1px;height:26px;background:var(--line);flex:none}
.tools{gap:2px;padding:4px 6px 6px}
.tool{flex:1 0 52px;height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tool.on{background:var(--yellow);color:#1A1D20}
.tool svg.i{width:22px;height:22px}

/* Overlays */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,12,14,.55);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.panel{background:var(--panel);color:var(--ink);width:100%;max-width:560px;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.ov{align-items:center}.panel{border-radius:18px;max-height:84vh}}
.panel h2{font:700 24px/1.1 "Barlow Condensed",Barlow,sans-serif;margin:0 0 4px}
.panel h3{font:600 17px/1.2 Barlow,sans-serif;margin:18px 0 8px;color:var(--muted)}
.panel p{margin:4px 0 12px;color:var(--muted)}
.phead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.phead h2{flex:1;margin:0}
.plist{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;text-align:left;width:100%}
.prow:hover{background:var(--raise)}
.prow canvas{flex:none;width:64px;height:34px;background:#5b6166;border-radius:6px}
.prow .lbl{flex:1;min-width:0;font-size:15px;line-height:1.3}
.prow .x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--red);flex:none}
.prow .tag{flex:none;width:64px;height:30px;border-radius:6px;background:#fff;color:#111;font-size:11px;display:grid;place-items:center;border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field img{max-height:44px;max-width:140px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
.switch{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ink)}
.switch.on::after{left:25px}
.dlg{background:var(--panel);width:calc(100% - 32px);max-width:440px;border-radius:16px;padding:18px;margin:auto}
#dlg{align-items:center}
.dlg h2{font:700 22px "Barlow Condensed",Barlow,sans-serif;margin:0 0 6px}
.dlg p{margin:0 0 12px;color:var(--muted)}
.dlg textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--raise);resize:vertical}
.dlg textarea:focus{outline:2px solid var(--yellow);outline-offset:0}
.dlg .actions{justify-content:flex-end}
#preview .panel{max-width:720px}
.pvwrap{background:var(--bg);border-radius:10px;padding:12px;display:flex;justify-content:center}
.pvwrap canvas{width:100%;max-width:520px;height:auto;box-shadow:var(--shadow);background:#fff}
.pvnav{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
#busy{position:fixed;inset:0;z-index:70;background:rgba(10,12,14,.45);display:none;place-items:center;color:#fff;font-weight:600}
#busy.on{display:grid}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="home">
  <header class="hd">
    <div class="mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
    <input id="projName" placeholder="Project name" aria-label="Project name" autocomplete="off">
    <button id="btnSettings" class="icon-btn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
  </header>
  <p class="sub">Six photos per page. Tap a photo to annotate it, tap the title to rename the page.</p>
  <main id="pages"></main>
  <div class="dock">
    <button id="btnGallery" class="btn ghost" aria-label="Add from gallery"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg></button>
    <button id="btnCamera" class="shoot"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Take photo</button>
    <button id="btnExportAll" class="btn ghost"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</button>
  </div>
</div>

<div id="editor" aria-label="Photo editor">
  <div class="etop">
    <button id="eDone" class="ib" aria-label="Done, back to pages"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div id="eTitle" class="etitle"></div>
    <button id="eUndo" class="ib" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="eRedo" class="ib" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="eDel" class="ib" aria-label="Delete selected"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="eMore" class="ib" aria-label="More"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    <button id="eNext" class="tb primary"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Next</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="hint" hidden><span id="hintTxt"></span><button id="hintX" aria-label="Stop using this symbol"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>
  <div class="ebottom">
    <div id="textRow" class="row textrow">
      <input id="txt" placeholder="Label text, stays until you change it" autocomplete="off" enterkeyhint="done">
      <button id="tMinus" class="tog" aria-label="Smaller text">A−</button>
      <button id="tPlus" class="tog" aria-label="Larger text">A+</button>
    </div>
    <div id="chips" class="row chips"></div>
    <div class="row">
      <div class="seg" id="targetSeg"><button data-t="stroke">Line</button><button data-t="fill">Fill</button></div>
      <div id="swatches" class="sw"></div>
      <div class="sep"></div>
      <button id="dashBtn" class="tog" aria-label="Dashed line"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h3M10 12h4M18 12h3"/></svg></button>
      <div class="seg" id="widthSeg"><button data-w="S">S</button><button data-w="M">M</button><button data-w="L">L</button></div>
    </div>
    <div id="tools" class="row tools"></div>
  </div>
</div>

<div id="sheet" class="ov"><div class="panel" id="sheetPanel"></div></div>
<div id="preview" class="ov"><div class="panel" id="pvPanel"></div></div>
<div id="dlg" class="ov"><div class="dlg">
  <h2 id="dlgT"></h2><p id="dlgP"></p>
  <textarea id="dlgIn" rows="3"></textarea>
  <div class="actions"><button id="dlgNo" class="btn ghost">Cancel</button><button id="dlgOk" class="btn primary">OK</button></div>
</div></div>
<div id="toast" role="status"></div>
<div id="busy"><span id="busyTxt">Working…</span></div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="logoIn" accept="image/*" hidden>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const ICON = {
  select:'<path d="M5 3l14 8-6 2-2 6z"/>',
  pen:'<path d="M3 17c3-6 6 4 9-2s5-6 9-4"/>',
  arrow:'<path d="M4 20 19 5"/><path d="M10 5h9v9"/>',
  line:'<path d="M4 20 20 4"/>',
  rect:'<rect x="4" y="6" width="16" height="12"/>',
  ellipse:'<ellipse cx="12" cy="12" rx="9" ry="7"/>',
  text:'<path d="M5 6h14M12 6v13"/>',
  callout:'<rect x="10" y="3" width="11" height="8"/><path d="M12 11 4 20"/><path d="M4 15v5h5"/>',
  legend:'<path d="M10 6h10M10 12h10M10 18h10"/><circle cx="5" cy="6" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="5" cy="18" r="1.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  dl:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',
};
const svg = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;

const COLORS = ['#FFD21F','#E3201B','#FF2BD6','#2AA7FF','#22C55E','#FF8A00','#FFFFFF','#1A1D20'];
const W_MULT = {S:1.1, M:1.8, L:2.8};
const SHAPES = ['arrow','line','rect','ellipse','pen'];
const DEFAULT_PRESETS = [
  {id:'s1', kind:'ellipse', small:true, stroke:'#FFD21F', fill:'#E3201B', dash:true, label:'Percez un trou de 16 mm pour faire passer le LSZH, puis refermez-le avec une pâte ignifuge.'},
  {id:'s2', kind:'rect', stroke:'#FFD21F', fill:'#E3201B', dash:true, label:'Intro Eurofiber existant au niveau -1'},
  {id:'s3', kind:'rect', stroke:'#E3201B', fill:null, dash:false, label:'Nouveau Budi à placer ici'},
  {id:'s4', kind:'arrow', stroke:'#FFD21F', fill:null, dash:true, label:'Traject LSZH dans le chemin de câbles existant'},
  {id:'s5', kind:'arrow', stroke:'#FF2BD6', fill:null, dash:true, label:'Traject LSZH du sous-sol au 2e étage via la gaine technique existante'},
  {id:'s6', kind:'rect', stroke:'#2AA7FF', fill:null, dash:false, label:'La gaine technique existante au 0 étage'},
  {id:'s7', kind:'rect', stroke:'#FFD21F', fill:'#E3201B', dash:true, label:'Placez ici l’ODF'},
  {id:'s8', kind:'rect', stroke:'#22C55E', fill:null, dash:false, label:'Salle des serveurs au 2e étage'},
  {id:'s9', kind:'line', stroke:'#E3201B', fill:null, dash:false, label:'Bac existant'},
  {id:'s10', kind:'arrow', stroke:'#FF2BD6', fill:null, dash:false, label:'Perçage dans l’asphalte : PVC125mm – contenu : 1xDB7'},
  {id:'s11', kind:'ellipse', stroke:'#FFD21F', fill:null, dash:false, label:'Placez un nouveau HH Eurofiber'},
  {id:'s12', kind:'ellipse', stroke:'#2AA7FF', fill:null, dash:false, label:'Connectez 1xDB7 avec 1xDB2'},

const store = {
  db:null, mem:new Map(),
  async init(){
    try{
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('site-survey-v1', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('photos', {keyPath:'id'}); r.result.createObjectStore('meta'); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    }catch(e){ this.db = null; }
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  },
  req(st, mode, f){
    return new Promise((res, rej) => {
      const t = this.db.transaction(st, mode); const r = f(t.objectStore(st));
      t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  async get(st, k){ if(!this.db) return this.mem.get(st+':'+k); return this.req(st, 'readonly', s => s.get(k)); },
  async put(st, v, k){ if(!this.db){ this.mem.set(st+':'+(k ?? v.id), v); return; } return this.req(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)); },
  async del(st, k){ if(!this.db){ this.mem.delete(st+':'+k); return; } return this.req(st, 'readwrite', s => s.delete(k)); },
  async clearAll(){ if(!this.db){ this.mem.clear(); return; } await this.req('photos','readwrite', s => s.clear()); await this.req('meta','readwrite', s => s.clear()); },
};

const FONT = s => `500 ${s}px Barlow, Arial, sans-serif`;

function edgePoint(b, tx, ty){

function boxFrame(a){

function arrowHead(ctx, x1, y1, x2, y2, size, color){

function strokeLine(ctx, a, x1, y1, x2, y2, head){

function drawAnn(ctx, a){

    if(a.stroke){ ctx.lineWidth = a.sw; ctx.strokeStyle = a.stroke; ctx.setLineDash(a.dash ? [a.sw*2.6, a.sw*1.9] : []); ctx.stroke(); }
  } else if(a.t === 'line' || a.t === 'arrow'){
    strokeLine(ctx, a, a.x1, a.y1, a.x2, a.y2, a.t === 'arrow');
  } else if(a.t === 'pen'){
    const p = a.pts; if(p.length){

      ctx.setLineDash(a.dash ? [a.sw*2.6, a.sw*1.9] : []);
      ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
      for(let i = 1; i < p.length-1; i++){ const mx = (p[i][0]+p[i+1][0])/2, my = (p[i][1]+p[i+1][1])/2; ctx.quadraticCurveTo(p[i][0], p[i][1], mx, my); }

function drawSymbol(ctx, p, x, y, w, h){

  else if(p.kind === 'rect') a = {t:'rect', x:x+sw*1.5, y:y+h*0.2, w:w-sw*3, h:h*0.6, stroke:p.stroke, fill:p.fill, dash:p.dash, sw:sw*0.8};
  else if(p.kind === 'ellipse'){ const r = p.small ? h*0.22 : h*0.36; a = {t:'ellipse', x:x+w/2-(p.small?r:r*1.6), y:y+h/2-r, w:(p.small?r:r*1.6)*2, h:r*2, stroke:p.stroke, fill:p.fill, dash:p.dash, sw:sw*(p.small?0.6:0.8)}; }

  drawAnn(ctx, a);
}

/* ---------- page geometry & export ---------- */
const PW = 1654, PH = 2339, PM = 84;
function legendItems(pg){
  const used = new Set();
  pg.photos.forEach(id => { const r = photos.get(id); r && (r.anns||[]).forEach(a => a.preset && used.add(a.preset)); });
  return S.presets.filter(p => SHAPES.includes(p.kind) && used.has(p.id));
}
function layoutCells(n, A, layout){
  const g = 20, cells = [];
  const grid = (n, R, cols) => {
    const rows = Math.ceil(n/cols), cw = (R.w-g*(cols-1))/cols, ch = (R.h-g*(rows-1))/rows;
    for(let i = 0; i < n; i++) cells.push({x:R.x+(i%cols)*(cw+g), y:R.y+Math.floor(i/cols)*(ch+g), w:cw, h:ch});
  };
  if(!n) return cells;
  if(layout === 'hero' && n > 1){
    const hh = n <= 3 ? A.h*0.56 : A.h*0.42;
    cells.push({x:A.x, y:A.y, w:A.w, h:hh});
    grid(n-1, {x:A.x, y:A.y+hh+g, w:A.w, h:A.h-hh-g}, n-1 === 1 ? 1 : 2);
  } else grid(n, A, n <= 2 ? 1 : 2);
  return cells;
}
function pageGeometry(pg){
  const top = PM + 96, footH = 104;
  let bottom = PH - PM - footH;
  const items = S.project.legend ? legendItems(pg) : [];
  let leg = null;
  if(items.length){ const rows = Math.ceil(items.length/2), h = rows*64 + 30; bottom -= h; leg = {x:PM, y:bottom+24, w:PW-2*PM, h:h-24, items}; }
  const cells = layoutCells(pg.photos.length, {x:PM, y:top, w:PW-2*PM, h:bottom-top}, pg.layout);
  return {cells, leg};
}
async function fontsReady(){ try{ await document.fonts.load(FONT(20)); await document.fonts.ready; }catch(e){} }
async function composite(rec, maxDim){
  const img = await loadImg(rec), k = Math.min(1, maxDim/Math.max(rec.w, rec.h));
  const c = mkCanvas(rec.w*k, rec.h*k), x = c.getContext('2d');
  x.imageSmoothingQuality = 'high'; x.scale(k, k); x.drawImage(img, 0, 0, rec.w, rec.h);
  (rec.anns||[]).forEach(a => drawAnn(x, a));
  return c;
}
function fitFont(x, text, maxW, size, min){ let s = size; x.font = FONT(s); while(s > min && x.measureText(text).width > maxW){ s -= 2; x.font = FONT(s); } return s; }
async function renderPage(pi){
  await fontsReady();
  const pg = S.pages[pi], c = mkCanvas(PW, PH), x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, PW, PH);
  x.fillStyle = '#111'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  fitFont(x, pg.title || '', PW-2*PM, 54, 30); x.fillText(pg.title || '', PW/2, PM+52);
  const {cells, leg} = pageGeometry(pg);
  for(let i = 0; i < pg.photos.length; i++){
    const rec = photos.get(pg.photos[i]); if(!rec) continue;
    const cp = await composite(rec, 1800), cl = cells[i];
    x.imageSmoothingQuality = 'high';
    if(pg.fit === 'fill'){
      const r = cropRect(rec, cl), f = cp.width/rec.w;
      x.drawImage(cp, r.x*f, r.y*f, r.w*f, r.h*f, cl.x, cl.y, cl.w, cl.h);
    } else {
      const k = Math.min(cl.w/cp.width, cl.h/cp.height), dw = cp.width*k, dh = cp.height*k;
      x.drawImage(cp, cl.x+(cl.w-dw)/2, cl.y+(cl.h-dh)/2, dw, dh);
    }
  }
  if(leg){
    const colW = (leg.w-40)/2;
    leg.items.forEach((p, i) => {
      const lx = leg.x + (i%2)*(colW+40), ly = leg.y + Math.floor(i/2)*64;
      x.fillStyle = '#5b6166'; x.fillRect(lx, ly+6, 86, 44);
      drawSymbol(x, p, lx+4, ly+8, 78, 40);
      x.fillStyle = '#111'; x.textAlign = 'left'; x.textBaseline = 'top'; x.font = FONT(23);
      const lines = wrap(x, p.label, colW-104).slice(0, 2);
      lines.forEach((l, j) => x.fillText(l, lx+102, ly+(lines.length === 1 ? 16 : 2)+j*27));
    });
  }
  if(S.project.logo){
    try{ const li = await loadDataImg(S.project.logo); const k = Math.min(340/li.width, 86/li.height); x.drawImage(li, PM, PH-PM-li.height*k, li.width*k, li.height*k); }catch(e){}
  }
  x.fillStyle = '#666'; x.textAlign = 'right'; x.textBaseline = 'alphabetic'; x.font = FONT(26);
  x.fillText(`${S.project.name ? S.project.name+'   ' : ''}Page ${pi+1} of ${S.pages.length}`, PW-PM, PH-PM-10);
  return c;
}
function cropRect(rec, cell){
  const a = cell.w/cell.h; let w = rec.w, h = rec.h;
  if(rec.w/rec.h > a) w = rec.h*a; else h = rec.w/a;
  let cx = rec.w/2, cy = rec.h/2;
  const anns = rec.anns || [];
  if(anns.length){
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    anns.forEach(an => { const b = bbox(an); x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y); x2 = Math.max(x2, b.x+b.w); y2 = Math.max(y2, b.y+b.h); });
    cx = (x1+x2)/2; cy = (y1+y2)/2;
  }
  return {x:clamp(cx-w/2, 0, rec.w-w), y:clamp(cy-h/2, 0, rec.h-h), w, h};
}
const canvasBlob = (c, type, q) => new Promise(r => c.toBlob(r, type, q));
async function exportPDF(indexes){
  if(!window.jspdf){ toast('The PDF library didn’t load. Check your connection and reload.'); return; }
  const list = indexes.filter(i => S.pages[i] && S.pages[i].photos.length);
  if(!list.length){ toast('Add a photo first. Empty pages aren’t exported.'); return; }
  busy(true, 'Building PDF…');
  try{
    const doc = new window.jspdf.jsPDF({orientation:'p', unit:'mm', format:'a4', compress:true});
    for(let n = 0; n < list.length; n++){
      busy(true, `Building PDF, page ${n+1} of ${list.length}…`);
      const c = await renderPage(list[n]);
      if(n) doc.addPage();
      doc.addImage(c.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
    }
    const blob = doc.output('blob');
    busy(false);
    await saveFile(fileBase() + (list.length === 1 ? `-page-${list[0]+1}` : '') + '.pdf', blob);
  }catch(e){ busy(false); toast('PDF export failed: ' + (e.message || e)); }
}

async function ingest(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('This file isn’t an image the browser can open.')); i.src = url; });
    const MAX = 2048; let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, MAX/Math.max(w, h));
    w = Math.round(w*k); h = Math.round(h*k);
    const c = mkCanvas(w, h); c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await canvasBlob(c, 'image/jpeg', 0.88);
    const t = mkCanvas(w*480/Math.max(w,h), h*480/Math.max(w,h)); t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
    const rec = {id:uid(), blob, w, h, anns:[], thumb:t.toDataURL('image/jpeg', 0.75)};
    await store.put('photos', rec);
    photos.set(rec.id, rec);
    return rec;
  } finally { URL.revokeObjectURL(url); }
}
function nextTitle(t){ const m = /^(\D*?)(\d+)/.exec(t || ''); return m ? t.replace(m[0], m[1] + (parseInt(m[2], 10)+1)) : (t || ''); }
function placePhoto(id, pi){
  let i = (pi != null && S.pages[pi] && S.pages[pi].photos.length < 6) ? pi : -1;
  if(i < 0){ const last = S.pages.length-1; i = S.pages[last].photos.length < 6 ? last : -1; }
  if(i < 0){ const prev = S.pages[S.pages.length-1]; const p = newPage(nextTitle(prev.title)); p.layout = prev.layout; p.fit = prev.fit; S.pages.push(p); i = S.pages.length-1; }
  S.pages[i].photos.push(id); saveMeta(); return i;
}

$('#galIn').onchange = async e => {

/* ---------- home ---------- */
$('#projName').oninput = e => { S.project.name = e.target.value; saveMeta(); };
function renderHome(){

  $('#pages').innerHTML = S.pages.map((pg, pi) => {

      const r = photos.get(id), c = cells[j];

    }).join('');
    const legHtml = leg ? `<div class="legph" style="left:${pct(leg.x,PW)};top:${pct(leg.y,PH)};width:${pct(leg.w,PW)};height:${pct(leg.h,PH)}">${leg.items.map(() => '<i></i>').join('')}</div>` : '';

        <div class="pnum">Page ${pi+1} of ${S.pages.length}</div>
      </div>

        <div class="seg" role="group" aria-label="Layout"><button data-layout="grid" class="${pg.layout==='grid'?'on':''}">Grid</button><button data-layout="hero" class="${pg.layout==='hero'?'on':''}">Big first</button></div>
        <div class="seg" role="group" aria-label="Photo size"><button data-fit="fit" class="${pg.fit!=='fill'?'on':''}">Fit</button><button data-fit="fill" class="${pg.fit==='fill'?'on':''}">Fill</button></div>

/* ---------- preview ---------- */
async function openPreview(pi){

  busy(false);
  const filled = S.pages.map((p, i) => p.photos.length ? i : -1).filter(i => i >= 0), k = filled.indexOf(pi);
  openSheet('preview', `
    <div class="phead"><h2>Page ${pi+1}</h2><button class="ib" data-close aria-label="Close">${svg('x')}</button></div>

}

/* ---------- editor ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');
const E = {rec:null, img:null, anns:[], sel:null, view:{s:1, ox:0, oy:0}, fitS:1, undo:[], redo:[], draft:null, mode:null, down:null, ptrs:new Map(), pinch:null, lastTap:null, dpr:1};
const U = () => Math.max(E.rec.w, E.rec.h)/300;
const selObj = () => E.anns.find(a => a.id === E.sel) || null;
const isLabel = a => a && (a.t === 'text' || a.t === 'callout');

async function openEditor(id){
  const rec = photos.get(id); if(!rec) return;
  E.rec = rec; E.anns = clone(rec.anns || []); E.sel = null; E.undo = []; E.redo = []; E.draft = null; E.mode = null;
  try{ E.img = await loadImg(rec); }catch(e){ toast('This photo couldn’t be opened.'); return; }
  const loc = locate(id);
  $('#eTitle').textContent = loc ? `Page ${loc.pi+1}, photo ${loc.j+1}` : 'Photo';
  $('#editor').classList.add('on');
  await fontsReady();
  sizeCanvas(); fit(); render(); updateUI();
}
function sizeCanvas(){
  const r = stage.getBoundingClientRect(); E.dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width*E.dpr); cv.height = Math.round(r.height*E.dpr);
}
function fit(){
  const r = stage.getBoundingClientRect(), s = Math.min(r.width/E.rec.w, r.height/E.rec.h)*0.98;
  E.fitS = s; E.view = {s, ox:(r.width-E.rec.w*s)/2, oy:(r.height-E.rec.h*s)/2};
}
window.addEventListener('resize', () => { if(E.rec && $('#editor').classList.contains('on')){ sizeCanvas(); fit(); render(); } });

function bbox(a){
  if(a.t === 'rect' || a.t === 'ellipse') return norm(a);
  if(a.t === 'line' || a.t === 'arrow') return {x:Math.min(a.x1,a.x2), y:Math.min(a.y1,a.y2), w:Math.abs(a.x2-a.x1), h:Math.abs(a.y2-a.y1)};
  if(a.t === 'pen'){ const xs = a.pts.map(p => p[0]), ys = a.pts.map(p => p[1]); const x = Math.min(...xs), y = Math.min(...ys); return {x, y, w:Math.max(...xs)-x, h:Math.max(...ys)-y}; }
  const b = labelBox(a);
  if(a.t === 'callout'){ const x = Math.min(b.x, a.ax), y = Math.min(b.y, a.ay); return {x, y, w:Math.max(b.x+b.w, a.ax)-x, h:Math.max(b.y+b.h, a.ay)-y}; }
  return b;
}
function handles(a, s){
  const off = 38/s, hs = [], fr = boxFrame(a);
  if(fr){
    const R = (lx, ly) => rotPt(fr.cx+lx, fr.cy+ly, fr.cx, fr.cy, fr.rot);
    if(a.t === 'rect' || a.t === 'ellipse') [['nw',-1,-1],['ne',1,-1],['sw',-1,1],['se',1,1]].forEach(([k, sx, sy]) => hs.push({...R(sx*fr.w/2, sy*fr.h/2), k}));
    else { hs.push({...R(fr.w/2, fr.h/2), k:'size'}); if(a.t === 'callout') hs.push({x:a.ax, y:a.ay, k:'tip'}); }
    hs.push({...R(0, -fr.h/2-off), k:'rot', base:R(0, -fr.h/2)});
  } else if(a.t === 'line' || a.t === 'arrow'){ hs.push({x:a.x1, y:a.y1, k:'p1'}, {x:a.x2, y:a.y2, k:'p2'}); }
  else if(a.t === 'pen'){ const b = bbox(a); hs.push({x:b.x+b.w/2, y:b.y-off, k:'rot', base:{x:b.x+b.w/2, y:b.y}}); }
  return hs;
}
function segDist(p, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1, l = dx*dx+dy*dy;
  const t = l ? clamp(((p.x-x1)*dx+(p.y-y1)*dy)/l, 0, 1) : 0;
  return Math.hypot(p.x-(x1+t*dx), p.y-(y1+t*dy));
}
function hitLocal(a, p, tol){
  if(a.t === 'rect'){
    const r = norm(a);
    if(p.x < r.x-tol || p.x > r.x+r.w+tol || p.y < r.y-tol || p.y > r.y+r.h+tol) return false;
    return !!a.fill || Math.min(r.w, r.h) < tol*3 || p.x <= r.x+tol || p.x >= r.x+r.w-tol || p.y <= r.y+tol || p.y >= r.y+r.h-tol;
  }
  if(a.t === 'ellipse'){
    const r = norm(a), rx = Math.max(r.w/2, 1), ry = Math.max(r.h/2, 1), m = Math.min(rx, ry);
    const d = Math.hypot((p.x-r.x-rx)/rx, (p.y-r.y-ry)/ry);
    return (a.fill || m < tol*1.5) ? d <= 1 + tol/m : Math.abs(d-1)*m <= tol;
  }
  if(a.t === 'line' || a.t === 'arrow') return segDist(p, a.x1, a.y1, a.x2, a.y2) <= tol + a.sw/2;
  if(a.t === 'pen'){ for(let i = 1; i < a.pts.length; i++) if(segDist(p, a.pts[i-1][0], a.pts[i-1][1], a.pts[i][0], a.pts[i][1]) <= tol + a.sw/2) return true; return a.pts.length === 1 && Math.hypot(p.x-a.pts[0][0], p.y-a.pts[0][1]) <= tol; }
  const b = labelBox(a);
  return p.x >= b.x-tol && p.x <= b.x+b.w+tol && p.y >= b.y-tol && p.y <= b.y+b.h+tol;
}
function hit(a, p, tol){
  const fr = boxFrame(a);
  if(hitLocal(a, fr && fr.rot ? rotPt(p.x, p.y, fr.cx, fr.cy, -fr.rot) : p, tol)) return true;
  if(a.t === 'callout'){ const e = leaderStart(a, labelBox(a)); return segDist(p, e.x, e.y, a.ax, a.ay) <= tol + a.sw/2; }
  return false;
}
function topHit(p, tol){ for(let i = E.anns.length-1; i >= 0; i--) if(hit(E.anns[i], p, tol)) return E.anns[i]; return null; }

function render(){
  if(!E.rec) return;
  const {s, ox, oy} = E.view, d = E.dpr;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(d*s, 0, 0, d*s, d*ox, d*oy);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(E.img, 0, 0, E.rec.w, E.rec.h);
  E.anns.forEach(a => drawAnn(ctx, a));
  if(E.draft) drawAnn(ctx, E.draft);
  const o = selObj();
  if(o){
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const pad = 8, fr = boxFrame(o), S2 = (x, y) => [x*s+ox, y*s+oy];
    ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 3; ctx.beginPath();
    if(fr){
      const hw = fr.w/2+pad/s, hh = fr.h/2+pad/s;
      [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].forEach(([lx, ly], i) => { const q = rotPt(fr.cx+lx, fr.cy+ly, fr.cx, fr.cy, fr.rot); const [X, Y] = S2(q.x, q.y); if(i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); });
      ctx.closePath();
    } else { const b = bbox(o); ctx.rect(b.x*s+ox-pad, b.y*s+oy-pad, b.w*s+pad*2, b.h*s+pad*2); }
    ctx.stroke(); ctx.restore();
    handles(o, s).forEach(h => {
      if(h.base){ ctx.beginPath(); ctx.moveTo(...S2(h.base.x, h.base.y)); ctx.lineTo(...S2(h.x, h.y)); ctx.setLineDash([]); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(h.x*s+ox, h.y*s+oy, 11, 0, Math.PI*2);
      ctx.fillStyle = h.k === 'size' ? '#FFD21F' : h.k === 'rot' ? '#2AA7FF' : '#fff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1A1D20'; ctx.stroke();
    });
  }
}

/* undo */
function snap(){ E.undo.push(JSON.stringify(E.anns)); if(E.undo.length > 80) E.undo.shift(); E.redo = []; }
function undo(){ if(!E.undo.length) return; E.redo.push(JSON.stringify(E.anns)); E.anns = JSON.parse(E.undo.pop()); if(!selObj()) E.sel = null; changed(); }
function redo(){ if(!E.redo.length) return; E.undo.push(JSON.stringify(E.anns)); E.anns = JSON.parse(E.redo.pop()); if(!selObj()) E.sel = null; changed(); }
let saveTimer = 0;
function changed(){ render(); updateUI(); clearTimeout(saveTimer); saveTimer = setTimeout(saveEditor, 700); }
async function saveEditor(){
  clearTimeout(saveTimer);
  if(!E.rec) return;
  E.rec.anns = clone(E.anns);
  try{ E.rec.thumb = (await composite(E.rec, 520)).toDataURL('image/jpeg', 0.75); }catch(e){}
  try{ await store.put('photos', E.rec); }catch(e){ toast('Couldn’t save this photo. Storage may be full.'); }
}

/* object creation */
function addRecent(t){ if(!t) return; S.recent = [t, ...S.recent.filter(x => x !== t)].slice(0, 12); saveMeta(); }
function newObj(t, p){
  const st = S.style, sw = U()*W_MULT[st.w], base = {id:uid(), preset:S.activePreset || null};
  if(t === 'rect' || t === 'ellipse') return {...base, t, x:p.x, y:p.y, w:0, h:0, stroke:st.color, fill:st.fill, dash:st.dash, sw};
  if(t === 'arrow' || t === 'line') return {...base, t, x1:p.x, y1:p.y, x2:p.x, y2:p.y, stroke:st.color, dash:st.dash, sw};
  if(t === 'pen') return {...base, t, pts:[[p.x, p.y]], stroke:st.color, dash:st.dash, sw};
  return {...base, preset:null, t, x:p.x, y:p.y, ax:p.x, ay:p.y, text:S.text || 'Label', size:U()*9*S.textMult, maxW:E.rec.w*0.5, stroke:st.color, dash:false, sw:U()*1.35};
}
function centerBoxAt(a, p){ const b = labelBox(a); a.x = clamp(p.x-b.w/2, 0, Math.max(0, E.rec.w-b.w)); a.y = clamp(p.y-b.h/2, 0, Math.max(0, E.rec.h-b.h)); }
function translate(a, o, dx, dy){
  ['x','y','x1','y1','x2','y2','ax','ay'].forEach((k, i) => { if(o[k] !== undefined) a[k] = o[k] + (i % 2 ? dy : dx); });
  if(o.pts) a.pts = o.pts.map(q => [q[0]+dx, q[1]+dy]);
}
function snapAng(r){ const st = Math.PI/2, n = Math.round(r/st); return Math.abs(r-n*st) < 0.07 ? n*st : r; }
function objCenter(o){
  const fr = boxFrame(o); if(fr) return {x:fr.cx, y:fr.cy};
  if(o.t === 'line' || o.t === 'arrow') return {x:(o.x1+o.x2)/2, y:(o.y1+o.y2)/2};
  const b = bbox(o); return {x:b.x+b.w/2, y:b.y+b.h/2};
}
function xf(p, m0, m, f, da){ const q = rotPt(p.x, p.y, m0.x, m0.y, da); return {x:m.x+(q.x-m0.x)*f, y:m.y+(q.y-m0.y)*f}; }
function transformFrom(a, o, m0, m, f, da, keepTip){
  if(o.t === 'line' || o.t === 'arrow'){ const p1 = xf({x:o.x1, y:o.y1}, m0, m, f, da), p2 = xf({x:o.x2, y:o.y2}, m0, m, f, da); a.x1 = p1.x; a.y1 = p1.y; a.x2 = p2.x; a.y2 = p2.y; return; }
  if(o.t === 'pen'){ a.pts = o.pts.map(q => { const r = xf({x:q[0], y:q[1]}, m0, m, f, da); return [r.x, r.y]; }); return; }
  const fr = boxFrame(o), c = xf({x:fr.cx, y:fr.cy}, m0, m, f, da), w = fr.w*f, h = fr.h*f;
  a.rot = (o.rot || 0) + da;
  if(o.t === 'rect' || o.t === 'ellipse'){ a.x = c.x-w/2; a.y = c.y-h/2; a.w = w; a.h = h; return; }
  a.size = o.size*f; a.maxW = o.maxW*f; a.x = c.x-w/2; a.y = c.y-h/2;
  if(o.t === 'callout' && !keepTip){ const t = xf({x:o.ax, y:o.ay}, m0, m, f, da); a.ax = t.x; a.ay = t.y; }
}
function applyHandle(a, o, k, p){
  if(k === 'rot'){
    const c = objCenter(o); let da = Math.atan2(p.y-c.y, p.x-c.x) - E.rotA0;
    if(boxFrame(o)) da = snapAng((o.rot || 0)+da) - (o.rot || 0);
    transformFrom(a, o, c, c, 1, da, true); return;
  }
  if(k === 'p1'){ a.x1 = p.x; a.y1 = p.y; return; }
  if(k === 'p2'){ a.x2 = p.x; a.y2 = p.y; return; }
  if(k === 'tip'){ a.ax = p.x; a.ay = p.y; return; }
  const fr = boxFrame(o), lp = rotPt(p.x, p.y, fr.cx, fr.cy, -fr.rot);
  let L;
  if(o.t === 'rect' || o.t === 'ellipse'){
    let x1 = fr.cx-fr.w/2, y1 = fr.cy-fr.h/2, x2 = fr.cx+fr.w/2, y2 = fr.cy+fr.h/2;
    if(k[1] === 'w') x1 = lp.x; else x2 = lp.x;
    if(k[0] === 'n') y1 = lp.y; else y2 = lp.y;
    L = {x:Math.min(x1, x2), y:Math.min(y1, y2), w:Math.abs(x2-x1), h:Math.abs(y2-y1)};
    a.w = L.w; a.h = L.h;
  } else if(k === 'size'){
    const tlx = fr.cx-fr.w/2, tly = fr.cy-fr.h/2, f = clamp(Math.max((lp.x-tlx)/fr.w, (lp.y-tly)/fr.h), 0.25, 6);
    a.size = o.size*f; a.maxW = o.maxW*f;
    L = {x:tlx, y:tly, w:fr.w*f, h:fr.h*f};
  } else return;
  const c = rotPt(L.x+L.w/2, L.y+L.h/2, fr.cx, fr.cy, fr.rot);
  a.x = c.x-L.w/2; a.y = c.y-L.h/2;
}
function finalize(a){ if(a.t === 'rect' || a.t === 'ellipse'){ const r = norm(a); a.x = r.x; a.y = r.y; a.w = r.w; a.h = r.h; } }

/* pointer handling */
const cpt = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
const toImg = sp => ({x:(sp.x-E.view.ox)/E.view.s, y:(sp.y-E.view.oy)/E.view.s});
stage.addEventListener('pointerdown', e => {
  if(e.target.closest('#hint')) return;
  e.preventDefault(); try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  E.ptrs.set(e.pointerId, cpt(e));
  if(E.ptrs.size === 2){ startPinch(); return; }
  if(E.ptrs.size > 2 || E.mode === 'idle') return;
  startSingle(cpt(e));
});
stage.addEventListener('pointermove', e => {
  if(!E.ptrs.has(e.pointerId)) return;
  E.ptrs.set(e.pointerId, cpt(e));
  if(E.mode === 'pinch' && E.ptrs.size >= 2) movePinch();
  else if(E.mode === 'otrans'){ if(E.ptrs.size >= 2) moveObjGesture(); }
  else if(E.down) moveSingle(cpt(e));
});
const up = e => {
  if(!E.ptrs.has(e.pointerId)) return;
  E.ptrs.delete(e.pointerId);
  if(E.mode === 'otrans') changed();
  if(E.mode === 'pinch' || E.mode === 'idle' || E.mode === 'otrans'){ E.mode = E.ptrs.size ? 'idle' : null; return; }
  if(E.down) endSingle();
};
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
stage.addEventListener('wheel', e => {
  e.preventDefault(); const sp = cpt(e), v = E.view;
  const s = clamp(v.s * Math.exp(-e.deltaY*0.0015), E.fitS*0.5, E.fitS*10);
  v.ox = sp.x - (sp.x-v.ox)*(s/v.s); v.oy = sp.y - (sp.y-v.oy)*(s/v.s); v.s = s; render();
}, {passive:false});

function startPinch(){
  const [a, b] = [...E.ptrs.values()], so = selObj();
  if((E.mode === 'move' || E.mode === 'handle') && so){
    if(E.mode === 'move' && !(E.down && E.down.moved)) snap();
    finalize(so);
    const A = toImg(a), B = toImg(b);
    E.orig = clone(so); E.down = null; E.mode = 'otrans';
    E.g0 = {m:{x:(A.x+B.x)/2, y:(A.y+B.y)/2}, d:Math.hypot(B.x-A.x, B.y-A.y) || 1, ang:Math.atan2(B.y-A.y, B.x-A.x)};
    render(); return;
  }
  if(E.mode === 'draw') E.draft = null;
  if(E.mode === 'handle' && E.down && !E.down.moved) E.undo.pop();
  E.down = null; E.mode = 'pinch';
  E.pinch = {d:Math.hypot(a.x-b.x, a.y-b.y) || 1, m:{x:(a.x+b.x)/2, y:(a.y+b.y)/2}, ...E.view};
  render();
}
function moveObjGesture(){
  const [a, b] = [...E.ptrs.values()], A = toImg(a), B = toImg(b), g = E.g0, o = selObj(); if(!o) return;
  const f = clamp(Math.hypot(B.x-A.x, B.y-A.y)/g.d, 0.15, 10);
  let da = Math.atan2(B.y-A.y, B.x-A.x) - g.ang;
  if(boxFrame(E.orig)) da = snapAng((E.orig.rot || 0)+da) - (E.orig.rot || 0);
  transformFrom(o, E.orig, g.m, {x:(A.x+B.x)/2, y:(A.y+B.y)/2}, f, da, true);
  render();
}
function movePinch(){
  const [a, b] = [...E.ptrs.values()], P = E.pinch;
  const s = clamp(P.s*(Math.hypot(a.x-b.x, a.y-b.y)/P.d), E.fitS*0.5, E.fitS*10), m = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  E.view = {s, ox:m.x-(P.m.x-P.ox)*(s/P.s), oy:m.y-(P.m.y-P.oy)*(s/P.s)};
  render();
}
function startSingle(sp){
  const p = toImg(sp), tol = 14/E.view.s, sel = selObj();
  E.down = {sp, p, moved:false, hadSel:!!sel};
  if(sel){
    for(const h of handles(sel, E.view.s)){
      if(Math.hypot(p.x-h.x, p.y-h.y) <= 24/E.view.s){
        snap(); E.mode = 'handle'; E.hk = h.k; E.orig = clone(sel);
        if(h.k === 'rot'){ const c = objCenter(sel); E.rotA0 = Math.atan2(p.y-c.y, p.x-c.x); }
        return;
      }
    }
  }
  const o = (sel && hit(sel, p, tol)) ? sel : topHit(p, tol);
  if(o){ E.sel = o.id; E.mode = 'move'; E.orig = clone(o); render(); updateUI(); return; }
  if(S.tool === 'select'){ E.sel = null; E.mode = 'pan'; E.panO = {ox:E.view.ox, oy:E.view.oy}; render(); updateUI(); return; }
  if(S.tool === 'text'){ E.mode = 'place'; return; }
  E.draft = newObj(S.tool, p); E.mode = 'draw';
  if(S.tool === 'callout') centerBoxAt(E.draft, p);
}
function moveSingle(sp){
  const d = E.down, p = toImg(sp);
  if(!d.moved && Math.hypot(sp.x-d.sp.x, sp.y-d.sp.y) > 6){
    d.moved = true;
    if(E.mode === 'move') snap();
    if(E.mode === 'draw' && E.sel){ E.sel = null; updateUI(); }
  }
  if(!d.moved) return;
  if(E.mode === 'pan'){ E.view.ox = E.panO.ox + sp.x-d.sp.x; E.view.oy = E.panO.oy + sp.y-d.sp.y; }
  else if(E.mode === 'move'){ const o = selObj(); if(o) translate(o, E.orig, p.x-d.p.x, p.y-d.p.y); }
  else if(E.mode === 'handle'){ const o = selObj(); if(o) applyHandle(o, E.orig, E.hk, p); }
  else if(E.mode === 'draw'){
    const a = E.draft;
    if(a.t === 'rect' || a.t === 'ellipse'){ a.w = p.x-a.x; a.h = p.y-a.y; }
    else if(a.t === 'arrow' || a.t === 'line'){ a.x2 = p.x; a.y2 = p.y; }
    else if(a.t === 'pen'){ const l = a.pts[a.pts.length-1]; if(Math.hypot(p.x-l[0], p.y-l[1]) > 3/E.view.s) a.pts.push([p.x, p.y]); }
    else if(a.t === 'callout') centerBoxAt(a, p);
  }
  render();
}
function tapObj(o){
  const now = performance.now();
  if(isLabel(o) && E.lastTap && E.lastTap.id === o.id && now-E.lastTap.t < 420){ E.lastTap = null; editLabel(o); return; }
  E.lastTap = {id:o.id, t:now};
}
async function editLabel(o){
  const t = await askText('Edit label', o.text, 'Save'); if(!t) return;
  snap(); o.text = t; S.text = t; addRecent(t); changed();
}
async function endSingle(){
  const d = E.down, mode = E.mode; E.down = null; E.mode = null;
  const tol = 14/E.view.s;
  if(mode === 'handle'){ if(!d.moved) E.undo.pop(); else finalize(selObj()); changed(); return; }
  if(mode === 'move'){ if(!d.moved){ const o = selObj(); if(o) tapObj(o); render(); updateUI(); return; } changed(); return; }
  if(mode === 'pan'){ render(); return; }
  if(mode === 'place'){
    if(d.hadSel){ E.sel = null; render(); updateUI(); return; }
    let t = S.text;
    if(!t.trim()){ t = await askText('Text', '', 'Place'); if(!t) return; }
    S.text = t; $('#txt').value = t; addRecent(t);
    const a = newObj('text', d.p); a.text = t; centerBoxAt(a, d.p);
    snap(); E.anns.push(a); E.sel = a.id; changed(); return;
  }
  if(mode === 'draw'){
    const a = E.draft; E.draft = null;
    if(!d.moved){
      if(d.hadSel){ E.sel = null; render(); updateUI(); return; }
      if(a.t === 'rect' || a.t === 'ellipse'){
        const pr = S.presets.find(x => x.id === a.preset), r = U()*(pr && pr.small ? 3.2 : 14);
        a.w = r*2; a.h = a.t === 'rect' ? r*1.4 : r*2; a.x = d.p.x-a.w/2; a.y = d.p.y-a.h/2;
      } else if(a.t === 'callout'){
        centerBoxAt(a, {x:d.p.x + U()*30, y:d.p.y - U()*24});
      } else { render(); return; }
    } else {
      if((a.t === 'arrow' || a.t === 'line') && Math.hypot(a.x2-a.x1, a.y2-a.y1) < 10/E.view.s){ render(); return; }
      if((a.t === 'rect' || a.t === 'ellipse') && (Math.abs(a.w) < 6/E.view.s || Math.abs(a.h) < 6/E.view.s)){ render(); return; }
    }
    if(a.t === 'callout'){
      if(!S.text.trim()){
        render(); const t = await askText('Label text', '', 'Place'); if(!t) return;
        S.text = t; $('#txt').value = t;
      }
      a.text = S.text; addRecent(a.text);
      if(!d.moved) centerBoxAt(a, {x:a.ax + U()*30 + labelBox(a).w/2, y:a.ay - U()*24});
    }
    finalize(a); snap(); E.anns.push(a); E.sel = a.id; changed();
  }
}

/* toolbar */
const TOOLS = [['select','Move'],['arrow','Arrow'],['line','Line'],['pen','Draw'],['rect','Box'],['ellipse','Circle'],['callout','Label'],['text','Text'],['legend','Legend']];
$('#tools').innerHTML = TOOLS.map(([k, l]) => `<button class="tool" data-tool="${k}">${svg(k)}<span>${l}</span></button>`).join('');

  S.tool = k; S.activePreset = null; saveMeta(); updateUI();
};
function currentStyle(){
  const o = selObj();
  if(o && !isLabel(o)) return {color:o.stroke, fill:o.fill || null, dash:!!o.dash, sw:o.sw};
  if(o && o.t === 'callout') return {color:o.stroke, fill:null, dash:!!o.dash};

}
function setStyle(k, v){
  S.style[k] = v; S.activePreset = null;
  const o = selObj();
  if(o && !(o.t === 'text' && k !== 'w')){
    snap();
    if(k === 'color') o.stroke = v;
    if(k === 'fill' && (o.t === 'rect' || o.t === 'ellipse')) o.fill = v;
    if(k === 'dash' && o.t !== 'text') o.dash = v;
    if(k === 'w' && !isLabel(o)) o.sw = U()*W_MULT[v];

}
$('#targetSeg').onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; S.style.target = b.dataset.t; saveMeta(); updateUI(); };
$('#swatches').onclick = e => {

  const c = b.dataset.c === 'none' ? null : b.dataset.c;

};
$('#dashBtn').onclick = () => setStyle('dash', !currentStyle().dash);
$('#widthSeg').onclick = e => { const b = e.target.closest('[data-w]'); if(b) setStyle('w', b.dataset.w); };
const txt = $('#txt');
txt.addEventListener('focus', () => { const o = selObj(); E.txtSnap = isLabel(o); if(E.txtSnap) snap(); });
txt.addEventListener('input', () => {
  S.text = txt.value; saveMeta();
  const o = selObj(); if(isLabel(o) && txt.value.trim()){ o.text = txt.value; render(); clearTimeout(saveTimer); saveTimer = setTimeout(saveEditor, 700); }
});
txt.addEventListener('change', () => { if(txt.value.trim()) addRecent(txt.value.trim()); renderChips(); });
txt.addEventListener('keydown', e => { if(e.key === 'Enter') txt.blur(); });
function textSize(f){
  S.textMult = clamp(S.textMult*f, 0.35, 4); saveMeta();

}
$('#tMinus').onclick = () => textSize(1/1.15);
$('#tPlus').onclick = () => textSize(1.15);
function renderChips(){
  const list = S.recent.length ? S.recent : S.presets.filter(p => p.kind === 'callout').map(p => p.label);
  $('#chips').innerHTML = list.map(t => `<button class="chip ${t === S.text ? 'on' : ''}" title="${esc(t)}">${esc(t)}</button>`).join('');

  });
}
function updateUI(){
  const o = selObj(), st = currentStyle();
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === S.tool));
  const textMode = isLabel(o) || S.tool === 'text' || S.tool === 'callout';

  const tgt = S.style.target, cur = tgt === 'fill' ? st.fill : st.color;
  $('#swatches').innerHTML = (tgt === 'fill' ? ['none', ...COLORS] : COLORS).map(c =>
    `<button class="swatch ${c === 'none' ? 'none' : ''} ${(c === 'none' ? cur == null : (cur || '').toUpperCase() === c) ? 'on' : ''}" data-c="${c}" ${c !== 'none' ? `style="background:${c}"` : ''} aria-label="${c === 'none' ? 'No fill' : c}"></button>`).join('');

  const pr = S.presets.find(p => p.id === S.activePreset);

  const h = pr ? 'Symbol: ' + pr.label : (o ? (isLabel(o) ? 'Drag to move. Two fingers or the blue dot to turn. Double-tap to edit.' : 'Drag to move. Two fingers to turn and resize. Tap empty space to deselect.') : (hints[S.tool] || ''));
  $('#hint').hidden = !h; $('#hintTxt').textContent = h; $('#hintX').hidden = !pr;
}
$('#hintX').onclick = () => { S.activePreset = null; saveMeta(); updateUI(); };
$('#eUndo').onclick = undo; $('#eRedo').onclick = redo;

$('#eDone').onclick = closeEditor;
$('#eNext').onclick = async () => { const loc = locate(E.rec.id); await closeEditor(); pendingPage = loc ? loc.pi : null; $('#camIn').click(); };
$('#eMore').onclick = () => {

/* presets */
function applyPreset(p){
  const o = selObj();
  if(p.kind === 'callout' || p.kind === 'text'){
    S.tool = p.kind; S.text = p.label; S.activePreset = null;
    if(p.stroke) S.style.color = p.stroke;
    if(isLabel(o)){ snap(); o.text = p.label; changed(); }
    addRecent(p.label);
  } else {
    S.tool = p.kind; S.style.color = p.stroke; S.style.fill = p.fill || null; S.style.dash = !!p.dash; S.activePreset = p.id;
    if(o && o.t === p.kind){ snap(); o.stroke = p.stroke; o.fill = p.fill || null; o.dash = !!p.dash; o.preset = p.id; changed(); }
    else E.sel = null;

}

        const kind = src ? src.t : (SHAPES.includes(S.tool) ? S.tool : 'arrow');
        const t = await askText('Legend text for this symbol', '', 'Save'); if(!t){ draw(); return; }
        const p = {id:uid(), kind, label:t, stroke:src ? src.stroke : S.style.color, fill:src ? (src.fill || null) : S.style.fill, dash:src ? !!src.dash : S.style.dash};
        S.presets.splice(S.presets.findIndex(x => x.kind === 'callout') < 0 ? S.presets.length : S.presets.findIndex(x => x.kind === 'callout'), 0, p);
        if(src){ snap(); src.preset = p.id; changed(); }
        saveMeta(); draw();
      };
      pn.querySelector('[data-newlbl]').onclick = async () => {
        const t = await askText('New label', '', 'Save'); if(t){ S.presets.push({id:uid(), kind:'callout', stroke:'#E3201B', label:t}); saveMeta(); }
        draw();
      };
    });
  draw();
}

/* ---------- boot ---------- */
(async () => {
  await store.init();
  try{
    const m = await store.get('meta', 'state');
    if(m){ const d = defaultState(); S = {...d, ...m, project:{...d.project, ...(m.project||{})}, style:{...d.style, ...(m.style||{})}}; if(!S.pages || !S.pages.length) S.pages = [newPage()]; }
  }catch(e){}
  for(const pg of S.pages){
    const keep = [];
    for(const id of pg.photos){ try{ const r = await store.get('photos', id); if(r){ photos.set(id, r); keep.push(id); } }catch(e){} }
    pg.photos = keep;
  }
  renderHome();
  if(!store.db) toast('Storage is unavailable here, so photos last only until you close this page.');
})();
})();
</script>
</body>
</html>
